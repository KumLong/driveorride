name: driveorride
description: DriveOrRide - Malaysian commute decision app (BMIT2073)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  sqflite: ^2.4.3
  path_provider: ^2.1.6
  image_picker: ^1.1.2
  path: ^1.9.1
  supabase_flutter: ^2.17.2
  csv: ^8.0.0
  location: ^10.0.2
  permission_handler: ^13.0.1
  local_auth: ^3.0.2
  share_plus: ^13.3.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  fl_chart: ^1.2.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/gtfs/
    - assets/icon/logo.png